/* Motion shared by all Casual Hub pages (same block in /index.html and opinion/index.html) */
/* Between pages the page slides sideways, no fading: forward to the left, back to the right */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html:active-view-transition-type(forward)::view-transition-old(root) { animation: vt-out-l .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(forward)::view-transition-new(root) { animation: vt-in-r .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(back)::view-transition-old(root) { animation: vt-out-r .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(back)::view-transition-new(root) { animation: vt-in-l .42s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes vt-out-l { to { transform: translateX(-100%); } }
@keyframes vt-in-r { from { transform: translateX(100%); } }
@keyframes vt-out-r { to { transform: translateX(100%); } }
@keyframes vt-in-l { from { transform: translateX(-100%); } }
.btn, .theme-btn { transition-property: transform, background-color, border-color, color, box-shadow, opacity; transition-duration: .12s; }
.btn:active:not(:disabled), .theme-btn:active { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
}
@media (max-width: 560px) { :root { --pad: 16px; } }

*, *::before, *::after { box-sizing: border-box; }
body {
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }
[data-tier="good"] { --tier: var(--good); }
[data-tier="mid"] { --tier: var(--mid); }
[data-tier="bad"] { --tier: var(--bad); }
[data-tier="idle"] { --tier: var(--cell); }

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
/* Dot grid fading to the edges (on html: body::before is the iPhone notch strip) */
html::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.5px); background-size: 18px 18px;
  -webkit-mask-image: radial-gradient(120% 90% at 50% 20%, #000 40%, transparent 100%);
  mask-image: radial-gradient(120% 90% at 50% 20%, #000 40%, transparent 100%);
}
:root { --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.2, .8, .2, 1); --lift: 0 1px 0 color-mix(in srgb, #fff 5%, transparent) inset, 0 26px 52px -32px rgba(0, 0, 0, .55); }

/* Шапка: навигация сверху (главная слева, остальное справа), под ней заголовок — как у «Царя Горы» */
.masthead { display: flex; flex-direction: column-reverse; align-items: stretch; gap: 26px; margin-bottom: 22px; }
.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 10vw, 86px); line-height: .82; letter-spacing: .005em; text-wrap: balance; }
.lede { margin-top: 12px; max-width: 60ch; color: var(--ink-2); text-wrap: pretty; }
.masthead-right { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
.user-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
#backLink { margin-right: auto; }
.theme-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px;
  background: color-mix(in srgb, var(--panel) 92%, transparent); color: var(--ink-2); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer;
  transition: transform .2s var(--spring), border-color .15s, color .15s, box-shadow .2s;
}
.theme-btn:hover { border-color: var(--accent); color: var(--ink); box-shadow: 0 6px 18px -10px color-mix(in srgb, var(--accent) 60%, transparent); }
#backLink:hover { transform: translateX(-2px); }
#opinionLink svg rect { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .35s var(--spring); }
#opinionLink:hover svg rect:nth-child(2) { transform: scaleY(1.2); }
#opinionLink:hover svg rect:nth-child(3) { transform: scaleY(.8); }
.online-chip { cursor: default; }
@media (max-width: 560px) {
  .page { padding-block: 18px 40px; }
  .masthead { gap: 18px; margin-bottom: 14px; }
  .title { font-size: clamp(44px, 13vw, 60px); }
  .ml-text, .hl-full, .wn-text { display: none; }
  #opinionLink, #whatsNewBtn { width: 36px; padding: 0; }
  #githubLink { display: none; }
  .oc-t, .fb-t { display: none; }
  .masthead-right > .user-bar { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; gap: 6px; }
}
@media (max-width: 360px) { #backLink { width: 36px; padding: 0; font-size: 0; } }
@media (max-width: 480px) { .acct-btn .acct-name { display: none; } .acct-btn { padding: 0 10px !important; } }
@media (max-width: 979px) { body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); } }

/* Буквы заголовка поднимаются по очереди и иногда подпрыгивают (только transform) */
.title .ch { display: inline-block; transform-origin: 50% 100%; animation: ch-in .3s cubic-bezier(.2, .9, .25, 1.25) backwards calc(min(var(--i), 10) * 18ms), ch-wave 8s ease-in-out calc(.5s + var(--i) * 60ms) infinite; transition: color .25s, scale .35s var(--spring); }
.title .ch:hover { color: var(--accent); scale: 1 1.08; }
.title .w { display: inline-block; white-space: nowrap; }
@keyframes ch-in { from { transform: translateY(60%) scaleY(.3); } }
@keyframes ch-wave { 0%, 12%, 100% { translate: 0 0; } 6% { translate: 0 -5%; } }

/* Карточки и кнопки — как на других страницах режимов */
.card {
  min-width: 0; padding: var(--pad); border: 1px solid var(--line); border-radius: 22px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 93%, var(--accent)) 0, var(--panel) 140px);
  box-shadow: var(--lift);
}
html.intro .hl > .card { animation: card-rise .3s var(--spring) backwards; }
html.intro .hl > .card + .card { animation-delay: .04s; }
html.intro .masthead-right { animation: drop-in .25s var(--out) backwards; }
@keyframes card-rise { from { transform: translateY(34px) scale(.985); } }
@keyframes drop-in { from { transform: translateY(-14px); } }
.label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: 11px; font-size: 14.5px; font-weight: 600; line-height: 1; white-space: nowrap; cursor: pointer; background: transparent; text-decoration: none; transition: transform .22s var(--spring), background-color .15s, border-color .15s, color .15s; }
.btn.primary { background: var(--ink); color: var(--panel); box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--ink) 70%, transparent); }
.btn.ghost { background: var(--panel); border-color: var(--line); color: var(--ink); }
.btn.text { height: 34px; padding: 0 10px; color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:focus-visible, .theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (hover: hover) {
  .btn.primary:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 84%, var(--accent)); transform: translateY(-1px); }
  .btn.ghost:hover:not(:disabled) { border-color: color-mix(in srgb, var(--ink) 32%, var(--line)); }
  .btn.text:hover { background: var(--accent-soft); }
}
.badge {
  display: inline-grid; place-items: center; min-width: 54px; height: 42px; padding: 0 8px; border-radius: 10px;
  background: var(--tier); color: var(--on-tier);
  font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;
  transition: background-color .25s, color .2s;
}
.badge[data-tier="idle"] { color: var(--ink); }
button, label, summary, input, a { touch-action: manipulation; }
@media (pointer: coarse) { .btn.text { height: 40px; } }

/* ---------- игра ---------- */
.hl { display: grid; gap: 20px; align-items: start; }
@media (min-width: 980px) { .hl { grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; } }
.hl-board { position: relative; overflow: hidden; }
.hl-empty { margin: 14px 0; font-size: 14px; color: var(--ink-2); text-align: center; }
.hl-msg { font-size: 13.5px; font-weight: 600; color: var(--bad-ink, var(--bad)); }
.hl-msg:empty { display: none; }
/* перед игрой: правила и «Начать» */
.hl-intro { display: grid; gap: 18px; max-width: 640px; margin: 0 auto; }
.hl-intro h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 5vw, 40px); line-height: .95; }
.hl-rules { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: r; }
.hl-rules li { position: relative; padding-left: 34px; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; counter-increment: r; }
.hl-rules li::before { content: counter(r); position: absolute; left: 0; top: -1px; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font: 800 14px/1 var(--font-display); }
.hl-rules b { color: var(--ink); font-weight: 600; }
.hl-warn { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 14px 16px; border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--line)); border-radius: 14px; background: color-mix(in srgb, var(--bad) 9%, var(--panel)); }
.hl-warn svg { grid-row: span 2; margin-top: 2px; color: var(--bad-ink, var(--bad)); }
.hl-warn strong { font-size: 16px; line-height: 1.3; }
.hl-warn span { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; }
.hl-go { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.hl-go .btn { min-width: 160px; }
.hl-go small { font-size: 12.5px; color: var(--ink-3); }
/* полоса над парой: серия и время на ход */
.hl-top { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 640px; margin: 0 auto 16px; }
.hl-streak { display: grid; gap: 2px; }
.hl-streak b { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: .85; font-variant-numeric: tabular-nums; transform-origin: 0 100%; }
.hl-streak b.up { animation: hl-up .32s var(--spring); }
@keyframes hl-up { 40% { transform: scale(1.18); color: var(--good); } }
.hl-time { flex: 0 1 240px; display: grid; gap: 6px; justify-items: end; }
.hl-time b { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: .9; font-variant-numeric: tabular-nums; }
.hl-meter { width: 100%; height: 8px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 9%, transparent); overflow: hidden; }
.hl-meter i { display: block; width: 100%; height: 100%; border-radius: inherit; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--p, 1)); }
.hl-time.low b { color: var(--bad-ink, var(--bad)); }
.hl-time.low .hl-meter i { background: var(--bad); }
.hl-time.off { visibility: hidden; }
/* пара: две карточки, между ними «или». Обложки, названия и баллы нельзя выделить, перетащить и открыть меню на них */
.hl-pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 14px; align-items: stretch; max-width: 640px; margin: 0 auto; }
.hl-or { align-self: center; font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--ink-3); }
.hl-card {
  display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; justify-items: center; align-content: start; min-width: 0;
  padding: 12px 12px 14px; border: 2px solid var(--line); border-radius: 18px; background: var(--panel); text-align: center;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  transition: border-color .18s, box-shadow .18s;
}
.hl-card * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.hl-card.good { border-color: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.hl-card.bad { border-color: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 22%, transparent); }
.hl-card.in { animation: hl-in .28s var(--out) backwards; }
@keyframes hl-in { from { opacity: 0; transform: translateY(10px); } }
/* обложка 2:3 — не выше того, что остаётся от экрана за вычетом остальной доски (~400 px: серия, подписи, балл, кнопки)
   и небольшого запаса: вся доска с кнопками помещается без прокрутки и на ноутбуке, и при крупном размере интерфейса
   (--dvh его учитывает) */
.hl-cover { position: relative; width: min(100%, max(96px, calc((100 * var(--dvh, 1vh) - 440px) * 2 / 3))); aspect-ratio: 2 / 3; border-radius: 12px; overflow: hidden; background: var(--cell); }
.hl-cover img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.hl-cover.wide img { object-fit: contain; }
.hl-cover em { position: absolute; inset: 0; display: grid; place-items: center; font: 800 40px/1 var(--font-display); font-style: normal; color: var(--ink-3); }
.hl-kind { font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hl-names { display: grid; gap: 1px; align-content: start; min-width: 0; width: 100%; }
.hl-name { font-size: 15.5px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
.hl-orig { font-size: 12px; line-height: 1.3; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-score { display: grid; justify-items: center; gap: 3px; }
.hl-score .badge { min-width: 76px; height: 54px; font-size: 40px; border-radius: 13px; }
.hl-score .badge[data-tier="idle"] { background: color-mix(in srgb, var(--ink) 8%, transparent); color: var(--ink-2); }
.hl-src { font-size: 12px; font-weight: 600; color: var(--ink-3); }
.hl-acts { grid-column: 3; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.hl-acts .btn { width: 100%; min-width: 0; height: 48px; padding: 0 10px; font-size: 15px; }
.hl-acts .btn svg { flex: none; }
/* «Верно» / «Мимо» — метка на обложке: баллы обеих карточек остаются на одной высоте */
.hl-res { position: absolute; left: 8px; top: 8px; padding: 4px 10px; border-radius: 999px; background: var(--good); color: var(--on-tier); font-size: 12.5px; font-weight: 800; line-height: 1.2; box-shadow: 0 4px 12px -4px rgb(0 0 0 / .45); }
.hl-card.bad .hl-res { background: var(--bad); }
.hl-keys { max-width: 640px; margin: 12px auto 0; font-size: 12.5px; color: var(--ink-3); text-align: center; }
@media (pointer: coarse) { .hl-keys { display: none; } }
/* конец игры */
.hl-over { display: grid; gap: 12px; justify-items: center; max-width: 640px; margin: 18px auto 0; padding: 18px 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel-2); text-align: center; }
.hl-over:not(.still) { animation: hl-in .28s var(--out) backwards; }
.hl-over h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 42px); line-height: .95; }
.hl-why { max-width: 46ch; font-size: 14.5px; color: var(--ink-2); text-wrap: pretty; }
.hl-why b { color: var(--ink); }
.hl-final { display: grid; justify-items: center; gap: 2px; }
.hl-final b { font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: .85; font-variant-numeric: tabular-nums; }
.hl-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.hl-tags span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); font-size: 12.5px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.hl-tags .rec { background: color-mix(in srgb, var(--good) 18%, transparent); color: color-mix(in srgb, var(--good) 72%, var(--ink)); }
.hl-tags .xp { background: var(--accent-soft); color: var(--accent); }
.hl-guest { font-size: 13.5px; color: var(--ink-2); }
.hl-guest a { color: var(--accent); font-weight: 700; }
.hl-over .btn { min-width: 180px; }
/* рекорды и друзья */
.hl-side { display: grid; gap: 16px; }
.hl-side h2 { font-size: 18px; line-height: 1.25; }
.hl-side h3 { font-size: 14px; color: var(--ink-2); }
.hl-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.hl-stats.one { grid-template-columns: minmax(0, 1fr); }
.hl-stat { display: flex; flex-direction: column; justify-content: space-between; gap: 6px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
.hl-stat span { font-size: 12px; line-height: 1.25; color: var(--ink-2); }
.hl-stat b { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: .9; font-variant-numeric: tabular-nums; }
.hl-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.hl-table th { padding: 0 6px 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-align: right; }
.hl-table td { padding: 6px; border-top: 1px solid var(--line); text-align: right; }
.hl-table :is(th, td):nth-child(2) { text-align: left; width: 100%; }
.hl-table td:first-child { width: 1.6em; padding-left: 0; color: var(--ink-3); text-align: left; }
.hl-table td:nth-child(2) { max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hl-table td:nth-child(3) { font-weight: 800; }
.hl-table a { color: inherit; text-decoration: none; }
.hl-table a:hover { color: var(--accent); }
.hl-table tr.me td { background: var(--accent-soft); }
.hl-table tr.me td:first-child { border-radius: 8px 0 0 8px; padding-left: 6px; }
.hl-table tr.me td:last-child { border-radius: 0 8px 8px 0; }
.hl-note { font-size: 13px; line-height: 1.45; color: var(--ink-2); text-wrap: pretty; }
.hl-note.muted { color: var(--ink-3); font-size: 12.5px; }
.hl-side .btn.ghost { justify-self: start; }
.hl-more { justify-self: start; margin-left: -10px; }
/* узкий экран: карточки уже, «или» не помещается — его нет */
@media (max-width: 560px) {
  .hl-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .hl-or { display: none; }
  .hl-card { padding: 8px 8px 10px; border-radius: 14px; gap: 6px; }
  .hl-name { font-size: 13.5px; }
  .hl-score .badge { min-width: 62px; height: 46px; font-size: 32px; }
  .hl-acts { grid-column: 1 / -1; }
  .hl-acts .btn { height: 50px; font-size: 15px; }
  .hl-streak b { font-size: 38px; }
  .hl-time b { font-size: 26px; }
  .hl-final b { font-size: 60px; }
}
@media (max-width: 360px) { .hl-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .hl-stat b { font-size: 28px; } }
/* большие экраны: шире страница и карточки */
@media (min-width: 1600px) { .page { max-width: 1480px; } .hl { grid-template-columns: minmax(0, 1fr) 360px; } .hl-pair, .hl-top, .hl-intro, .hl-over, .hl-keys { max-width: 760px; } }
@media (min-width: 2200px) { .page { max-width: 1900px; } .title { font-size: 104px; } .hl-pair, .hl-top, .hl-intro, .hl-over, .hl-keys { max-width: 900px; } body { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
/* iPhone увеличивает страницу, если у поля шрифт меньше 16px: на iOS поля всегда 16px */
@supports (-webkit-touch-callout: none) { input, textarea, select { font-size: max(16px, 1em) !important; } }

<style id="unslop-page">
/* Казуальный вид (unslop): действует, только когда в Настройках выбран не «Обычный» вид. Без цветных отсветов, пружин,
   подскоков и заглавных подписей с разрядкой. Обычный вид выше не меняется */
html.unslop .label { text-transform: none; letter-spacing: normal; }
html.unslop .label::first-letter { text-transform: uppercase; }
:root.unslop { --spring: cubic-bezier(.22, 1, .36, 1); }
html.unslop .theme-btn:hover { box-shadow: 0 6px 18px -10px rgb(0 0 0 / .28); }
html.unslop .title .ch { animation: u-in var(--mo-in) var(--mo-ease) backwards calc(min(var(--i), 10) * 14ms); transition: color .15s; }
html.unslop .title .ch:hover { scale: none; }
html.unslop.intro .masthead-right { animation-name: u-down; animation-duration: var(--mo-in); animation-timing-function: var(--mo-ease); }
html.unslop.intro .hl > .card { animation-name: u-in; animation-duration: var(--mo-in); animation-timing-function: var(--mo-ease); }
html.unslop .card { background: var(--panel); }
html.unslop .btn.primary { box-shadow: inset 0 1px 0 rgb(255 255 255 / .12); }
/* «Выше или ниже»: верный и неверный ответ — рамка цветом без отсвета, новая карточка и итог — кадрами вида */
html.unslop .hl-card.good, html.unslop .hl-card.bad { box-shadow: none; }
html.unslop .hl-card.in, html.unslop .hl-over:not(.still) { animation: u-in var(--mo-in) var(--mo-ease) backwards; }
html.unslop .hl-streak b.up { animation: u-tap var(--mo-in) var(--mo-ease); }
html.unslop .hl-rules li::before { border-radius: 6px; }
@media (prefers-reduced-motion: no-preference) {
  html.unslop[data-ui] .title .ch { animation: u-in var(--mo-in) var(--mo-ease) backwards calc(min(var(--i), 10) * 14ms), u-hop 8s ease-in-out calc(.5s + var(--i) * 60ms) infinite; }
}
</style>
</head>
