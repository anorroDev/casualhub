/* Layout: a profile. Top bar, a hero card with avatar and titles, stats; then the ratings column and a side column with friends and taste. */
:root {
  --bg: #ECEEF3; --dot: #D3D7E0; --panel: #FFFFFF; --panel-2: #F4F5F8;
  --ink: #14161C; --ink-2: #565C6B; --ink-3: #666C7B; --line: #DADDE5; --cell: #E1E4EB;
  --accent: #3550E8; --accent-soft: #E7EBFF;
  --good: #2EAD60; --mid: #EAA92C; --bad: #E4553F; --bad-ink: #B93222; --on-tier: #14161C;
  --font-display: "Handjet", "Onest", ui-sans-serif, system-ui, sans-serif;
  --font-body: "Onest", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --glow: .22; --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.2, .8, .2, 1);
  --lift: 0 1px 0 color-mix(in srgb, #fff 70%, transparent) inset, 0 24px 48px -30px color-mix(in srgb, var(--ink) 45%, transparent);
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {

    --ink: #E8EAF0; --ink-2: #A3A9B8; --ink-3: #7B8191; --line: #2A2F3A; --cell: #272C36;
    --accent: #8C9BFF; --accent-soft: #232A4F;
    --good: #43C97A; --mid: #F2BA44; --bad: #F26A55; --bad-ink: #FF8E7D; --on-tier: #0D0F14;
    --glow: .3; --lift: 0 1px 0 color-mix(in srgb, #fff 5%, transparent) inset, 0 26px 52px -32px rgba(0, 0, 0, .7);
    --on-accent: var(--on-tier);
    color-scheme: dark;
  }
}

/* Motion shared by all Casual Hub pages */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html:active-view-transition-type(forward)::view-transition-old(root) { animation: vt-out-l .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(forward)::view-transition-new(root) { animation: vt-in-r .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(back)::view-transition-old(root) { animation: vt-out-r .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(back)::view-transition-new(root) { animation: vt-in-l .42s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes vt-out-l { to { transform: translateX(-100%); } }
@keyframes vt-in-r { from { transform: translateX(100%); } }
@keyframes vt-out-r { to { transform: translateX(100%); } }
@keyframes vt-in-l { from { transform: translateX(-100%); } }
html.theme-swap::view-transition-old(root) { animation: none; }
html.theme-swap::view-transition-new(root) { animation: theme-circle .6s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes theme-circle { from { clip-path: circle(0 at var(--tx, 50%) var(--ty, 0)); } to { clip-path: circle(150vmax at var(--tx, 50%) var(--ty, 0)); } }

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background-color: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
html::before {
  content: ""; position: fixed; inset: -12vmax; z-index: -1; pointer-events: none; will-change: transform;
  background:
    radial-gradient(36vmax 28vmax at 18% 12%, color-mix(in srgb, var(--accent) calc(var(--glow) * 100%), transparent), transparent 70%),
    radial-gradient(30vmax 26vmax at 86% 30%, color-mix(in srgb, var(--good) calc(var(--glow) * 50%), transparent), transparent 70%),
    radial-gradient(32vmax 26vmax at 50% 96%, color-mix(in srgb, var(--mid) calc(var(--glow) * 40%), transparent), transparent 70%);
  animation: drift 28s ease-in-out infinite alternate;
}
html::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.5px); background-size: 18px 18px;
  -webkit-mask-image: radial-gradient(120% 90% at 50% 20%, #000 40%, transparent 100%);
  mask-image: radial-gradient(120% 90% at 50% 20%, #000 40%, transparent 100%);
}
@keyframes drift { 0% { transform: translate3d(0, 0, 0) rotate(0deg); } 50% { transform: translate3d(3vmax, -2vmax, 0) rotate(5deg); } 100% { transform: translate3d(-2vmax, 2vmax, 0) rotate(-4deg); } }
a { color: inherit; }
h1, h2, h3, p { margin: 0; }
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[data-tier="good"] { --tier: var(--good); }
[data-tier="mid"] { --tier: var(--mid); }
[data-tier="bad"] { --tier: var(--bad); }
[data-tier="none"] { --tier: var(--cell); }

.page { max-width: 1180px; margin: 0 auto; padding-block: 20px 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* Top bar */
.top { display: flex; align-items: center; gap: 8px; margin-bottom: 22px; animation: drop-in .6s var(--out) backwards; }
.top .sp { flex: 1; }
.online-chip { cursor: default; }
@media (max-width: 560px) { .top .oc-t, .top .fb-t { display: none; } .top { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; } }
@media (max-width: 360px) { .top > .pill:first-child { width: 36px; padding: 0; font-size: 0; justify-content: center; } }
@keyframes drop-in { from { transform: translateY(-14px); } }
.pill {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 13px;
  border: 1px solid var(--line); border-radius: 999px; background: color-mix(in srgb, var(--panel) 92%, transparent);
  color: var(--ink-2); font-size: 13.5px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: transform .2s var(--spring), border-color .15s, color .15s, box-shadow .2s;
}
.pill:hover { border-color: color-mix(in srgb, var(--accent) 70%, var(--line)); color: var(--ink); box-shadow: 0 6px 18px -10px color-mix(in srgb, var(--accent) 60%, transparent); }
.pill:active { transform: scale(.95); }
.pill svg { flex: none; }
.pill:focus-visible, .btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .fr:focus-visible, .theme-opt:focus-visible, .search:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-pick { position: relative; }
.theme-pick > summary { list-style: none; }
.theme-pick > summary::-webkit-details-marker { display: none; }
.theme-menu {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 210px; display: grid; gap: 2px; padding: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 50px -20px color-mix(in srgb, var(--ink) 55%, transparent);
  transform-origin: 90% 0; animation: menu-in .26s var(--spring) both;
}
@keyframes menu-in { from { transform: translateY(-6px) scale(.94); } }
.theme-opt { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
.theme-opt i { flex: none; width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 20%, transparent); transition: transform .3s var(--spring); }
.theme-opt:hover { background: var(--panel-2); }
.theme-opt:hover i { transform: rotate(180deg) scale(1.1); }
.theme-opt[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }

/* Cards */
.card {
  background: linear-gradient(180deg, color-mix(in srgb, var(--panel) 93%, var(--accent)) 0, var(--panel) 140px);
  border: 1px solid var(--line); border-radius: 22px; padding: 22px; box-shadow: var(--lift); min-width: 0;
}
.rise { animation: rise .8s var(--spring) backwards; animation-delay: calc(var(--d, 0) * 70ms); }
@keyframes rise { from { transform: translateY(30px) scale(.985); } }
.label { display: block; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 4vw, 40px); line-height: .9; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 14px; margin-bottom: 16px; }
.muted { color: var(--ink-2); font-size: 14px; text-wrap: pretty; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 42px; padding: 0 16px; border: 1px solid transparent; border-radius: 12px;
  font-size: 14.5px; font-weight: 600; text-decoration: none; white-space: nowrap; cursor: pointer; transition: transform .22s var(--spring), background-color .15s, border-color .15s;
}
.btn.primary { background: var(--ink); color: var(--panel); box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--ink) 70%, transparent); }
.btn.primary:hover { background: color-mix(in srgb, var(--ink) 84%, var(--accent)); transform: translateY(-1px); }
.btn.ghost { background: var(--panel); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: color-mix(in srgb, var(--ink) 32%, var(--line)); }
.btn:active { transform: scale(.96); }

/* Hero */
.hero { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 26px; align-items: start; padding: 0 26px 26px; }
/* Banner: own picture or a ready-made one; without one, soft light in the site colours */
.banner {
  position: relative; grid-column: 1 / -1; margin: 0 -26px; height: clamp(220px, 31vw, 420px); overflow: hidden;
  border-radius: 21px 21px 0 0; background-color: var(--panel-2); background-size: cover; background-position: center;
}
.banner.def {
  background-image:
    radial-gradient(55% 130% at 12% 0%, color-mix(in srgb, var(--accent) 55%, transparent), transparent 70%),
    radial-gradient(45% 120% at 80% 10%, color-mix(in srgb, var(--good) 40%, transparent), transparent 70%),
    radial-gradient(40% 100% at 55% 110%, color-mix(in srgb, var(--mid) 40%, transparent), transparent 70%);
}
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, color-mix(in srgb, var(--panel) 55%, transparent) 80%, var(--panel)); pointer-events: none; }
.banner.drag::before {
  content: "Отпусти, чтобы поставить баннер"; position: absolute; inset: 10px; z-index: 2; display: grid; place-items: center;
  border: 2px dashed var(--accent); border-radius: 14px; background: color-mix(in srgb, var(--accent-soft) 80%, transparent); color: var(--accent); font-weight: 700;
}
.banner.busy { filter: saturate(.6) brightness(.8); }
/* Soft edges: the top and bottom bands of the banner are slightly blurred */
.ban-blur { position: absolute; left: 0; right: 0; z-index: 1; pointer-events: none; -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); }
.ban-blur.top { top: 0; height: 22%; -webkit-mask-image: linear-gradient(#000, transparent); mask-image: linear-gradient(#000, transparent); }
.ban-blur.bot { bottom: 0; height: 30%; -webkit-mask-image: linear-gradient(transparent, #000); mask-image: linear-gradient(transparent, #000); }
.banner::after { z-index: 1; }
/* Choosing the visible part: drag the picture inside the banner */
.banner.posing { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: inset 0 0 0 3px var(--accent); }
.banner.posing.grabbing { cursor: grabbing; }
.ban-pos {
  position: absolute; left: 50%; bottom: 16px; z-index: 4; transform: translateX(-50%); display: flex; align-items: center; gap: 10px;
  max-width: calc(100% - 24px); padding: 6px 6px 6px 14px; border-radius: 999px; background: rgba(10, 12, 18, .72); color: #fff;
  font-size: 13px; font-weight: 600; white-space: nowrap;
}
.ban-pos span { overflow: hidden; text-overflow: ellipsis; }
.ban-pos .btn { height: 34px; padding: 0 14px; border-radius: 999px; background: #fff; color: #14161C; box-shadow: none; }
.ban-btn {
  position: absolute; right: 14px; top: 14px; z-index: 3; display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 13px;
  border: 1px solid rgba(255, 255, 255, .28); border-radius: 999px; background: rgba(10, 12, 18, .5); color: #fff;
  font-size: 13.5px; font-weight: 600; cursor: pointer; transition: transform .2s var(--spring), background-color .15s;
}
.ban-btn:hover { background: rgba(10, 12, 18, .7); }
.ban-btn:active { transform: scale(.95); }
.ban-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.ban-menu {
  position: absolute; right: 14px; top: 58px; z-index: 6; width: min(320px, calc(100% - 28px)); display: grid; gap: 10px; padding: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 50px -20px color-mix(in srgb, var(--ink) 60%, transparent);
  transform-origin: 90% 0; animation: menu-in .26s var(--spring) both;
}
.ban-up { position: relative; width: 100%; }
/* стикер возле ника */
.name-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; min-width: 0; }
.name-row .name { min-width: 0; }
.name-row .name[role="button"] { cursor: text; }
.name-row .name[role="button"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 6px; }
/* колокольчик подписки у ника друга — значок вместо кнопки с надписью */
.name-ic, .bell { flex: none; align-self: center; display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--panel-2); color: var(--ink-2); cursor: pointer; transition: transform .25s var(--spring), background-color .15s, color .15s, border-color .15s; }
.name-ic:hover, .bell:hover { color: var(--ink); border-color: var(--accent); transform: translateY(-2px); }
.name-ic:active, .bell:active { transform: scale(.9); }
.name-ic:focus-visible, .bell:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.bell { width: 46px; height: 46px; }
.bell.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, #fff); box-shadow: 0 8px 20px -10px var(--accent); }
.bell svg { transform-origin: 50% 12%; }
.bell.ring svg { animation: bell-ring .9s ease-in-out; }
@keyframes bell-ring { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-15deg); } 45% { transform: rotate(11deg); } 60% { transform: rotate(-7deg); } 75% { transform: rotate(3deg); } }
.ic-btn { width: 42px; padding: 0; display: inline-grid; place-items: center; }
@media (prefers-reduced-motion: reduce) { .bell.ring svg { animation: none; } }
/* история аватарок (меню у аватарки) и баннеров (в меню «Баннер») */
.hist-menu { position: fixed; z-index: 80; width: min(300px, calc(100vw - 32px)); display: grid; gap: 10px; padding: 12px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 24px 48px -20px rgba(0, 0, 0, .5); cursor: default; animation: hist-in .4s var(--spring); }
@keyframes hist-in { from { transform: translateY(-8px) scale(.96); } }
.hist-menu .label { margin: 0; }
.hist-grid { display: grid; gap: 8px; }
.hist-grid.hg-ava { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.hist-grid.hg-ban { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hist-it { position: relative; display: block; }
.hist-it.gone { animation: hist-out .25s ease-in forwards; }
@keyframes hist-out { to { transform: scale(0); } }
.hist-pic { display: block; width: 100%; padding: 0; border: 2px solid var(--line); background: var(--panel-2) center / cover no-repeat; cursor: pointer; transition: transform .2s var(--spring), border-color .15s; }
.hist-grid.hg-ava .hist-pic { aspect-ratio: 1; border-radius: 50%; }
.hist-grid.hg-ban .hist-pic { aspect-ratio: 3 / 1; border-radius: 8px; }
.hist-pic:hover { transform: scale(1.06); border-color: var(--accent); }
.hist-x { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--ink); color: var(--panel); font-size: 11px; cursor: pointer; opacity: .85; }
.hist-x:hover { opacity: 1; background: var(--bad); color: #fff; }
.hist-empty { grid-column: 1 / -1; margin: 0; font-size: 13px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { .hist-menu, .hist-it.gone { animation: none; } }
/* стена комментариев внизу профиля и ветка в карточке оценки */
.wall { margin-top: 18px; }
.rd-cm { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.name-edit { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; width: min(100%, 560px); }
.name-edit input { min-width: 0; flex: 1 1 260px; height: 54px; padding: 0 14px; border: 1px solid var(--accent); border-radius: 12px; background: var(--panel); color: var(--ink); font: 800 clamp(30px, 5vw, 52px)/1 var(--font-display); box-shadow: 0 0 0 3px var(--accent-soft); }
.name-edit .btn { height: 38px; }
.nick-st { flex: none; width: clamp(52px, 7vw, 76px); aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 14px; background: none; color: inherit; }
.nick-st img, .nick-st video { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
button.nick-st { cursor: pointer; transition: transform .2s var(--spring); }
button.nick-st:hover { transform: scale(1.08) rotate(-4deg); }
button.nick-st:active { transform: scale(.94); }
button.nick-st:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.nick-st.empty { width: auto; aspect-ratio: auto; height: 34px; padding: 0 12px; align-self: center; border: 1.5px dashed var(--line); border-radius: 999px; font: 600 13px var(--font-body); color: var(--ink-2); }
.nick-st.empty:hover { color: var(--ink); border-color: var(--accent); transform: none; }
.st-pick { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.st-pick[hidden] { display: none; }
.st-card { width: min(560px, 100%); max-height: min(640px, calc(100dvh - 32px)); display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 60px -24px color-mix(in srgb, var(--ink) 60%, transparent); }
.st-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.st-head h2 { font-family: var(--font-display); font-size: 24px; line-height: 1; }
.st-x { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); font-size: 18px; cursor: pointer; }
.st-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.st-tabs::-webkit-scrollbar { display: none; }
.st-tabs button { flex: none; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--ink-2); font: 600 13px var(--font-body); cursor: pointer; }
.st-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.st-grid { min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); grid-auto-rows: min-content; gap: 6px; align-content: start; overscroll-behavior: contain; }
.st-grid button { min-width: 0; overflow: hidden; aspect-ratio: 1; padding: 6px; border-radius: 12px; border: 2px solid transparent; background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.st-grid button:hover { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.st-grid button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft, var(--panel-2)); }
.st-grid img, .st-grid video { width: 100%; height: 100%; min-width: 0; object-fit: contain; pointer-events: none; }
.st-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.st-foot small { font-size: 12px; color: var(--ink-3); }
.ban-hint { font-size: 12px; color: var(--ink-3); }
.ban-presets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.ban-presets button {
  aspect-ratio: 3 / 1; padding: 0; border: 2px solid transparent; border-radius: 9px; background: var(--panel-2) center / cover;
  cursor: pointer; transition: transform .2s var(--spring), border-color .15s;
}
.ban-presets button:hover { transform: scale(1.05); border-color: var(--accent); }
.ban-presets button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ban-msg { font-size: 12.5px; color: var(--ink-2); }
.ban-msg:empty { display: none; }
.ban-msg.err { color: var(--bad-ink); font-weight: 600; }
.ava-wrap { position: relative; z-index: 1; width: 116px; height: 116px; flex: none; margin-top: -64px; }
.ava-wrap.can { cursor: pointer; }
.ava-wrap.can:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 50%; }
.ava-edit {
  position: absolute; right: 2px; bottom: 2px; z-index: 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--ink); color: var(--panel); border: 3px solid var(--panel); transition: transform .25s var(--spring);
}
.ava-wrap.can:hover .ava-edit { transform: scale(1.12) rotate(-8deg); }
.ava-wrap.busy .ava { filter: brightness(.6); }
.fr .av { background-size: cover; background-position: center; }
.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); z-index: 70; max-width: min(92vw, 460px); padding: 11px 18px; border-radius: 14px;
  background: var(--ink); color: var(--panel); font-size: 14px; font-weight: 600; text-align: center;
  opacity: 0; transform: translate(-50%, -18px) scale(.92); transition: opacity .2s, transform .45s var(--spring); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.who { padding-top: 12px; }
.ava-ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(var(--bad), var(--mid), var(--good), var(--accent), var(--bad));
  animation: spin 14s linear infinite; will-change: transform;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ava {
  position: absolute; inset: 5px; border-radius: 50%; border: 4px solid var(--panel); display: grid; place-items: center;
  background-color: var(--accent); background-size: cover; background-position: center;
  color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 54px; line-height: 1; text-transform: uppercase;
}
.who { min-width: 0; display: grid; gap: 8px; }
.name { font-family: var(--font-display); font-weight: 800; font-size: clamp(44px, 7vw, 76px); line-height: .85; overflow-wrap: anywhere; }
.name .ch { display: inline-block; transform-origin: 50% 100%; animation: ch-in .7s cubic-bezier(.2, .9, .25, 1.25) backwards calc(var(--i) * 40ms); }
@keyframes ch-in { from { transform: translateY(60%) scaleY(.3); } }
.sub { color: var(--ink-2); font-size: 14px; }
.titles { display: flex; flex-wrap: wrap; gap: 6px; }
.title-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 700; color: var(--ink);
}
.title-chip i { width: 8px; height: 8px; border-radius: 2px; background: var(--tier, var(--accent)); }
/* звание «Администратор»: красное, у админов сайта */
.title-chip.t-admin { background: color-mix(in srgb, var(--bad) 16%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 60%, var(--line)); color: var(--bad-ink); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 12%, transparent); }
.title-chip.t-admin i { background: var(--bad); border-radius: 50%; box-shadow: 0 0 6px var(--bad); }
.hero-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }

/* Stats */
/* кубики цифр растягиваются на всю ширину: сколько бы их ни было, ряд (и последний неполный тоже) заполнен */
.stats { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 12px; margin-top: 16px; }
.stats > .stat { flex: 1 1 150px; min-width: 0; }
.stat { position: relative; padding: 16px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--lift); }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: .9; font-variant-numeric: tabular-nums; }
.stat > span { display: block; margin-top: 6px; font-size: 12.5px; color: var(--ink-2); }
.stat.tiered b { color: color-mix(in srgb, var(--tier) 78%, var(--ink)); }

/* Two columns */
.grid { display: grid; gap: 16px; margin-top: 16px; align-items: start; }
@media (min-width: 980px) { .grid { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; } }
.col { display: grid; gap: 16px; min-width: 0; }

/* Histogram 1–10 */
/* значки: полученные яркие, следующий с полоской до получения, остальные приглушены */
.bdg { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.bdg-i { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 9px; padding: 10px 9px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-2, var(--panel)); min-width: 0; }
.bdg-i .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 19px; line-height: 1; background: color-mix(in srgb, var(--accent) 16%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.bdg-i b { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; hyphens: auto; }
.bdg-i > span:last-child { min-width: 0; }
.bdg-i small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.bdg-i .tr { display: block; height: 4px; border-radius: 99px; background: var(--cell, var(--line)); margin-top: 6px; overflow: hidden; }
.bdg-i .tr i { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
.bdg-i.off .ic { filter: grayscale(1); opacity: .45; background: var(--cell, var(--line)); box-shadow: none; }
.bdg-i.off b { color: var(--ink-2); }
.bdg-more { margin-top: 8px; }
.bdg-more summary { cursor: pointer; padding: 8px 2px; font-size: 13.5px; font-weight: 700; color: var(--accent); list-style: none; }
.bdg-more summary::-webkit-details-marker { display: none; }
.bdg-more[open] summary { margin-bottom: 6px; }
.bdg-i { animation: rise .7s var(--spring) backwards; animation-delay: calc(var(--k, 0) * 45ms + .2s); }
.st-card { animation: menu-in .28s var(--spring) both; transform-origin: 50% 0; }
.nick-st.pop { animation: st-pop .55s var(--spring); }
@keyframes st-pop { 0% { transform: scale(.4) rotate(-20deg); } 100% { transform: none; } }
.bdg-i.next { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
/* ачивки: эмблема на градиенте своего семейства, у неполученных — полоса с процентами */
.bdg-i { position: relative; }
.bdg-i.got { padding-right: 26px; border-color: color-mix(in srgb, var(--c2) 35%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 12%, var(--panel-2, var(--panel))), var(--panel-2, var(--panel)) 65%); }
.bdg-i .ic { width: 42px; height: 42px; border-radius: 13px; font-size: 0; color: #fff; background: linear-gradient(140deg, var(--c1), var(--c2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), inset 0 -2px 0 rgba(0, 0, 0, .14), 0 8px 16px -10px var(--c2); }
.bdg-i .ic svg { filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .22)); }
.bdg-i.off .ic { filter: grayscale(1); opacity: .5; background: linear-gradient(140deg, var(--c1), var(--c2)); box-shadow: none; }
.bdg-i .ok { position: absolute; top: 7px; right: 7px; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(140deg, var(--c1), var(--c2)); color: #fff; font-size: 10px; font-weight: 900; }
.bdg-i .pg { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
.bdg-i .pg .tr { flex: 1; height: 7px; margin: 0; border-radius: 99px; background: var(--cell, var(--line)); overflow: hidden; }
.bdg-i .pg .tr i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--c1), var(--c2)); transform-origin: 0 50%; animation: ach-fill 1s var(--spring) backwards; animation-delay: calc(var(--k, 0) * 45ms + .35s); }
.bdg-i .pg em { flex: none; min-width: 30px; text-align: right; font-style: normal; font-size: 11.5px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.bdg-i.next .pg em { color: var(--ink); }
@keyframes ach-fill { from { transform: scaleX(0); } }
.ach-sum { display: flex; align-items: center; gap: 12px; margin: -4px 0 14px; }
.ach-sum .tr { flex: 1; height: 10px; border-radius: 99px; background: var(--cell, var(--line)); overflow: hidden; }
.ach-sum .tr i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #34D399, #60A5FA 50%, #C084FC); transform-origin: 0 50%; animation: ach-fill 1.1s var(--spring) .3s backwards; }
.ach-sum b { font-family: var(--font-display); font-size: 24px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { .bdg-i .pg .tr i, .ach-sum .tr i { animation: none; } }
.hist { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; align-items: end; height: 140px; }
.hist div { display: grid; grid-template-rows: 1fr auto auto; height: 100%; gap: 4px; text-align: center; }
.hist .bar { align-self: end; border-radius: 6px; background: var(--tier); min-height: 4px; transform-origin: 50% 100%; animation: grow-y .8s var(--spring) backwards; animation-delay: calc(.3s + var(--d) * 45ms); }
.hist .bar.zero { background: var(--cell); }
.hist small { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.hist em { font-style: normal; font-family: var(--font-display); font-weight: 700; font-size: 18px; line-height: 1; color: var(--ink-2); }
@keyframes grow-y { from { transform: scaleY(0); } }

/* Podium */
.podium { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: end; }
.pod {
  position: relative; display: grid; gap: 8px; padding: 12px; border-radius: 18px; background: var(--panel-2); border: 1px solid var(--line);
  text-decoration: none; min-width: 0; transition: transform .3s var(--spring);
  grid-template-columns: minmax(0, 1fr); /* Safari иначе растягивает картинку шире карточки */
}
.pod:hover { transform: translateY(-4px); }
.pod.p1 { order: 2; } .pod.p2 { order: 1; } .pod.p3 { order: 3; }
.pod .pic { position: relative; width: 100%; min-width: 0; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; display: grid; place-items: center; background: color-mix(in srgb, var(--tier) 22%, var(--panel)); }
.pod.p1 .pic { aspect-ratio: 1; }
.pod .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pod .pic .ltr { font-family: var(--font-display); font-weight: 800; font-size: 54px; color: color-mix(in srgb, var(--tier) 70%, var(--ink)); }
.pod .place { position: absolute; left: 8px; top: 8px; z-index: 1; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 9px; background: var(--ink); color: var(--panel); font-family: var(--font-display); font-weight: 800; font-size: 20px; }
.pod.p1 .place { background: var(--mid); color: var(--on-tier); }
.pod strong { font-size: 14.5px; line-height: 1.25; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pod .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pod .row small { color: var(--ink-3); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@supports not (aspect-ratio: 1 / 1) { .pod .pic { height: 96px; } .pod.p1 .pic { height: 128px; } }

/* Нажимаемые плитки, категории, оценки */
button.stat, button.cat { font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; }
button.cat { display: grid; padding: 6px 8px; margin: 0 -8px; width: calc(100% + 16px); border: 0; border-radius: 10px; background: transparent; }
a.item, a.pod { color: inherit; text-decoration: none; }
button.stat, a.item, a.pod, button.cat { transition: transform .2s var(--spring), border-color .15s, background-color .15s; }
@media (hover: hover) {
  button.stat:hover, a.pod:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
  a.item:hover, button.cat:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
}

.wg[data-off] > :is(.card, .stats) { opacity: .35; filter: grayscale(.8); }

.wg-btn { position: absolute; z-index: 3; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--panel); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 800; box-shadow: 0 8px 18px -10px rgba(0, 0, 0, .7); cursor: pointer; transition: transform .2s var(--spring), border-color .15s, color .15s; }

/* нижний край: тянуть, чтобы поменять высоту (тоже только на широком экране) */
