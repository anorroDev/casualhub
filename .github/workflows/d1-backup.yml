# Ежедневная резервная копия базы D1 (аккаунты, друзья, оценки, фото).
# Копия шифруется паролем BACKUP_PASSPHRASE: репозиторий публичный, а в базе почты и хэши паролей.
# Секреты задаёт владелец репозитория: Settings → Secrets and variables → Actions
#   CLOUDFLARE_API_TOKEN  — токен с правом D1: Edit
#   CLOUDFLARE_ACCOUNT_ID — id аккаунта Cloudflare
#   BACKUP_PASSPHRASE     — длинный пароль для шифрования копий (хранить отдельно!)
name: D1 backup

on:
  schedule:
    - cron: '17 3 * * *' # каждый день в 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning::Резервная копия пропущена: не заданы секреты CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BACKUP_PASSPHRASE."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Export and encrypt
        if: steps.check.outputs.ready == 'true'
        run: |
          stamp=$(date -u +%Y-%m-%d)
          npx --yes wrangler@4 d1 export casualhub --remote --output=dump.sql
          gzip -9 dump.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_PASSPHRASE -in dump.sql.gz -out "casualhub-$stamp.sql.gz.enc"
          rm dump.sql.gz
          ls -l casualhub-*.enc
          echo "STAMP=$stamp" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.ready == 'true'
        with:
          name: casualhub-d1-${{ env.STAMP }}
          path: casualhub-*.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
