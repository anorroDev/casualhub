  --on-accent: var(--on-tier);
  color-scheme: dark;
}
/* Motion shared by all Casual Hub pages (same block in /index.html and opinion/index.html) */
/* Between pages the page slides sideways, no fading: forward to the left, back to the right */
@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
html:active-view-transition-type(forward)::view-transition-old(root) { animation: vt-out-r .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(forward)::view-transition-new(root) { animation: vt-in-l .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(back)::view-transition-old(root) { animation: vt-out-l .42s cubic-bezier(.4, 0, .2, 1) both; }
html:active-view-transition-type(back)::view-transition-new(root) { animation: vt-in-r .42s cubic-bezier(.4, 0, .2, 1) both; }
@keyframes vt-out-l { to { transform: translateX(-100%); } }
@keyframes vt-in-r { from { transform: translateX(100%); } }
@keyframes vt-out-r { to { transform: translateX(100%); } }
@keyframes vt-in-l { from { transform: translateX(-100%); } }
/* Buttons press in; menus and sections that appear slide up a little (.enter is set by script) */
.btn, .seg button, .theme-btn, .mini-btn, .view-tab, .theme-opt, .mnav button, .th, .opt {
  transition-property: transform, background-color, border-color, color, box-shadow, opacity; transition-duration: .12s;
}
.btn:active:not(:disabled), .seg button:active, .theme-btn:active, .mini-btn:active:not(:disabled),
.theme-opt:active, .mnav button:active, .th:active, .opt:active { transform: scale(.96); }
.enter { animation: enter-up .24s cubic-bezier(.2, .8, .2, 1) both; }
.theme-pick[open] .theme-menu, details.tool[open] > .dbody { animation: enter-up .2s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes enter-up { from { transform: translateY(8px); } }
@media (prefers-reduced-motion: reduce) {
  ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; }
  .enter { animation: none; }
}
.theme-pick { position: relative; }
.theme-pick > summary { list-style: none; }
.theme-pick > summary::-webkit-details-marker { display: none; }
.theme-menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 200px;
  display: grid; gap: 2px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--ink) 55%, transparent);
}
.theme-opt {
  display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 9px;
  background: transparent; color: var(--ink); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer;
}
.theme-opt i { flex: none; width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 20%, transparent); }
.theme-opt[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.theme-opt:hover { background: var(--panel-2); }
.theme-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
@media (max-width: 560px) { .theme-menu { right: auto; left: 0; } }
@media (max-width: 560px) { :root { --pad: 16px; } }

*, *::before, *::after { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.5px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4, p { margin: 0; }
svg { flex: none; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
[hidden] { display: none !important; }
[data-tier="good"] { --tier: var(--good); }
[data-tier="bad"] { --tier: var(--bad); }
[data-tier="idle"] { --tier: var(--cell); }

.page {
  max-width: 1180px;
  margin: 0 auto;
  padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Masthead */
.masthead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 32px; margin-bottom: 22px; }
.title { font-family: var(--font-display); font-weight: 800; font-size: clamp(52px, 10vw, 86px); line-height: .82; letter-spacing: .005em; text-wrap: balance; }
.lede { margin-top: 12px; max-width: 54ch; color: var(--ink-2); text-wrap: pretty; }
.masthead-right { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.user-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; }
.theme-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; padding: 0 11px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--panel); color: var(--ink-2); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer;
  transition: border-color .15s, color .15s, background-color .15s;
}
.theme-btn:hover { border-color: var(--accent); color: var(--ink); }
.scale { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.scale span { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px 5px 7px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
.scale i { width: 16px; height: 10px; border-radius: 3px; }
.scale .k-win i { background: var(--ink); }
.scale .k-out i { background: var(--bad); }

.layout { display: grid; gap: 20px; align-items: start; }
@media (min-width: 980px) { .layout { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr); gap: 24px; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: var(--pad); min-width: 0; }
.label { display: block; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: 11px; font-size: 14.5px; font-weight: 600; line-height: 1; white-space: nowrap; cursor: pointer; background: transparent; transition: background-color .15s, border-color .15s, color .15s; }
.btn.small { height: 36px; padding: 0 12px; font-size: 13.5px; border-radius: 9px; }
.btn.primary { background: var(--ink); color: var(--panel); }
.btn.ghost { background: var(--panel); border-color: var(--line); color: var(--ink); }
.btn.text { height: 34px; padding: 0 10px; color: var(--accent); }
.btn.danger { color: var(--bad-ink); }
.btn.danger[data-armed] { background: var(--bad); border-color: var(--bad); color: var(--on-tier); }
.btn:disabled { opacity: .45; cursor: default; }
.mini-btn { flex: none; width: 34px; height: 34px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); cursor: pointer; }
.mini-btn:disabled { opacity: .3; cursor: default; }
.link-btn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.btn:focus-visible, .mini-btn:focus-visible, .link-btn:focus-visible, .seg button:focus-visible, .theme-btn:focus-visible, .th:focus-visible, details > summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.eyebrow { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
.eyebrow .dot { width: 9px; height: 9px; border-radius: 2px; background: var(--accent); transition: background-color .15s; }
/* Segmented controls and tabs */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; }
.seg button { height: 32px; padding: 0 11px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px color-mix(in srgb, var(--ink) 18%, transparent); }
.seg.cur button { min-width: 40px; font-size: 15px; font-weight: 700; }
.views { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 22px; }
.view-tab {
  padding: 0; border: 0; background: none; cursor: pointer;
  font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 9vw, 46px); line-height: .9;
  color: var(--ink-3); transition: color .15s;
}
.view-tab[aria-selected="true"] { color: var(--ink); cursor: default; }
.view-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 6px; }
.sheet {
  position: fixed; inset: 0; z-index: 60; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(5, 6, 10, .55); overscroll-behavior: contain;
}
.sheet-card { width: min(520px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 16px; padding: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sheet-actions .btn { flex: 1 1 auto; }
@keyframes pop { from { transform: translateY(12px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet:not([hidden]) .sheet-card { animation: pop .35s cubic-bezier(.2, 1.2, .4, 1); }
button, label, summary, input, textarea, select, a { touch-action: manipulation; }
@media (max-width: 560px) {
  .page { padding-block: 18px 40px; }
  .masthead { gap: 10px; margin-bottom: 14px; }
  .title { font-size: clamp(44px, 13vw, 60px); }
  .lede { display: none; }
  .masthead-right { align-items: flex-start; }
  .user-bar, .scale { justify-content: flex-start; }
  .sheet { place-items: end stretch; padding: 0; }
  .sheet-card {
    width: 100%; max-height: 92vh; max-height: 92dvh; border-bottom: 0; border-radius: 18px 18px 0 0;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet-actions .btn { flex: 1 1 100%; }
}

@media (hover: hover) {
  .btn.primary:hover { background: color-mix(in srgb, var(--ink) 84%, var(--accent)); }
  .btn.ghost:hover { border-color: color-mix(in srgb, var(--ink) 32%, var(--line)); }
  .btn.text:hover { background: var(--accent-soft); }

/* Masthead: the legend sits under the intro, the nav stays one row; on phones GitHub is just an icon */

/* ===== Polish: depth, light and motion, same language as the hub and Мнение. Everything that moves is transform or opacity ===== */
:root {
  --spring: cubic-bezier(.34, 1.56, .64, 1); --out: cubic-bezier(.2, .8, .2, 1);
  --glow: .26;
  --lift: 0 1px 0 color-mix(in srgb, #fff 5%, transparent) inset, 0 26px 52px -32px rgba(0, 0, 0, .55);
}
body { background-image: none; overflow-x: hidden; }
/* Ambient light pools and a dot grid fading to the edges (on html: body::before is the iPhone notch strip) */
html::before {
  content: ""; position: fixed; inset: -12vmax; z-index: -1; pointer-events: none; will-change: transform;
  background:
    radial-gradient(36vmax 28vmax at 18% 12%, color-mix(in srgb, var(--accent) calc(var(--glow) * 100%), transparent), transparent 70%),
    radial-gradient(30vmax 26vmax at 86% 30%, color-mix(in srgb, #EC4899 calc(var(--glow) * 45%), transparent), transparent 70%),
    radial-gradient(32vmax 26vmax at 50% 96%, color-mix(in srgb, var(--mid) calc(var(--glow) * 40%), transparent), transparent 70%);
  animation: drift 28s ease-in-out infinite alternate;
}
html::after {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 1.5px); background-size: 18px 18px;
  -webkit-mask-image: radial-gradient(120% 90% at 50% 20%, #000 40%, transparent 100%);
  mask-image: radial-gradient(120% 90% at 50% 20%, #000 40%, transparent 100%);
}
@keyframes drift {
  0% { transform: translate3d(0, 0, 0) rotate(0deg); }
  50% { transform: translate3d(3vmax, -2vmax, 0) rotate(5deg); }
  100% { transform: translate3d(-2vmax, 2vmax, 0) rotate(-4deg); }
}

/* Header: navigation is a top bar (home on the left, the rest on the right), the title sits under it */
.masthead { flex-direction: column-reverse; align-items: stretch; gap: 26px; }
.masthead-right { align-items: stretch; }
.masthead-right > .user-bar { justify-content: flex-end; }

.theme-btn {
  height: 36px; padding: 0 13px; gap: 7px;

  transition: transform .2s var(--spring), border-color .15s, color .15s, box-shadow .2s;
}

/* Title letters rise one by one and breathe (transforms only) */
.title .ch { display: inline-block; transform-origin: 50% 100%; animation: ch-in .7s cubic-bezier(.2, .9, .25, 1.25) backwards calc(var(--i) * 40ms), ch-wave 8s ease-in-out calc(1.6s + var(--i) * 60ms) infinite; transition: color .25s, scale .35s var(--spring); }

/* Cards: accent light at the top edge and real depth */
