# Worker casualhub-rt: комната лотов вживую (Durable Object LotRoomDO). Выкладка: npx wrangler deploy -c rt/wrangler.toml
# Сайт (Pages) подключает его привязкой LOT_RT в корневом wrangler.toml. Порядок и откат — в README, раздел «Лоты вживую».
name = "casualhub-rt"
main = "worker.js"
compatibility_date = "2025-04-01"
# из интернета Worker недоступен: к нему ходит только сайт через привязку
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "casualhub"
database_id = "b4b84c20-3c2a-499c-8e46-d82f9ba9daf5"

[[durable_objects.bindings]]
name = "LOT_ROOM"
class_name = "LotRoomDO"

# хранилище комнат — SQLite: такие Durable Objects есть и на бесплатном плане Workers
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LotRoomDO"]
